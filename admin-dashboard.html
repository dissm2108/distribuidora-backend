<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Panel del administrador</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
 --papel:#F4F3EE;--carta:#FFF;--tinta:#20241E;--mut:#6E7268;--linea:#E0DED4;
 --trigo:#B97A1F;--trigo-l:#F7EDD9;--verde:#2F6B4F;--verde-l:#E7F1EB;
 --rojo:#B23B2E;--rojo-l:#F9E9E6;--azul:#33608F;--azul-l:#E9F0F7;--morado:#6C4E8E;
 --r1:#2F7D4F;--r2:#63A05E;--r3:#A9AE45;--r4:#D9A32F;--r5:#DF7A2B;--r6:#C74E2C;--r7:#8E3040;--r8:#54222E;
 --sombra:0 1px 3px rgba(32,36,30,.07),0 3px 12px rgba(32,36,30,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--papel);color:var(--tinta);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:13.5px;line-height:1.45;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#C9C6B8;border-radius:4px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.eyebrow{font-size:9.5px;letter-spacing:2.2px;text-transform:uppercase;font-weight:800;color:var(--mut)}

/* ═══ LAYOUT ═══ */
.shell{display:flex;min-height:100vh}
.side{width:216px;background:var(--tinta);color:#D8D6CB;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
.logo b{font-size:15px;color:#F0EEE6;letter-spacing:.3px}
.logo span{display:block;font-size:8.5px;letter-spacing:2.4px;color:#8A8E80;text-transform:uppercase;margin-top:3px}
.nav{flex:1;padding:10px;overflow-y:auto}
.ni{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:9px;font-size:12.5px;font-weight:600;color:#A9AC9E;margin-bottom:2px;transition:.13s}
.ni:hover{background:rgba(255,255,255,.06);color:#F0EEE6}
.ni.on{background:var(--trigo);color:#fff}
.ni .ic{width:18px;text-align:center}
.ni .bd{margin-left:auto;background:var(--rojo);color:#fff;font-size:10px;font-weight:800;border-radius:9px;padding:1px 7px}
.ni.on .bd{background:rgba(255,255,255,.25)}
.side-f{padding:12px 16px;border-top:1px solid rgba(255,255,255,.07);font-size:10px;color:#8A8E80;line-height:1.6}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:var(--carta);border-bottom:1px solid var(--linea);padding:12px 22px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:500}
.top h1{font-size:16px;font-weight:800}
.top .st{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);background:var(--papel);border:1px solid var(--linea);border-radius:8px;padding:5px 10px}
.content{padding:20px 22px 60px;max-width:1240px;width:100%;margin:0 auto}
.sec{display:none}.sec.on{display:block}

/* ═══ COMPONENTES ═══ */
.card{background:var(--carta);border:1px solid var(--linea);border-radius:12px;box-shadow:var(--sombra);margin-bottom:16px}
.ch{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--linea)}
.ch h3{font-size:13.5px;font-weight:800}
.ch .eyebrow{margin-left:auto}
.cb{padding:14px 16px}
.g2{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
@media(max-width:980px){.g2{grid-template-columns:1fr}}
.kpi{background:var(--carta);border:1px solid var(--linea);border-radius:12px;padding:14px 16px;box-shadow:var(--sombra)}
.kpi .v{font-size:22px;font-weight:800;margin-top:3px}
.kpi .s{font-size:10.5px;color:var(--mut);margin-top:3px;line-height:1.5}
.kpi.lock{background:repeating-linear-gradient(45deg,var(--carta),var(--carta) 8px,#FAF9F5 8px,#FAF9F5 16px)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px;white-space:nowrap}
.p-ve{background:var(--verde-l);color:var(--verde)}.p-ro{background:var(--rojo-l);color:var(--rojo)}
.p-tr{background:var(--trigo-l);color:var(--trigo)}.p-az{background:var(--azul-l);color:var(--azul)}
.p-gr{background:#EFEEE8;color:var(--mut)}.p-mo{background:#F0EAF7;color:var(--morado)}
.pend{border:1px dashed var(--trigo);background:#FFFDF7;color:var(--trigo);font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:6px;display:inline-flex;gap:4px;align-items:center}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut);padding:8px 10px;border-bottom:2px solid var(--linea);font-weight:800;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #EFEDE5;vertical-align:middle}
tr:last-child td{border-bottom:none}
.num{text-align:right;font-variant-numeric:tabular-nums}
tr.clk{cursor:pointer}tr.clk:hover td{background:#FCFBF7}
.btn{padding:8px 13px;border-radius:9px;font-size:12px;font-weight:700;border:1px solid transparent;transition:.12s;min-height:36px}
.btn:active{transform:scale(.97)}
.b-p{background:var(--tinta);color:#fff}.b-p:hover{background:#000}
.b-v{background:var(--verde);color:#fff}
.b-r{background:var(--rojo-l);color:var(--rojo);border-color:#EBC7C2}
.b-l{background:#fff;border-color:var(--linea)}.b-l:hover{border-color:var(--tinta)}
.b-t{background:var(--trigo);color:#fff}
.bj{border:1px solid var(--linea);border-left:4px solid var(--trigo);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#FFFEFA}
.bj.ro{border-left-color:var(--rojo)}.bj.az{border-left-color:var(--azul)}.bj.ve{border-left-color:var(--verde)}.bj.mo{border-left-color:var(--morado)}
.bj .t{font-size:12.5px;font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bj .d{font-size:11.5px;color:var(--mut);margin:5px 0 9px;line-height:1.55}
.bj .a{display:flex;gap:8px;flex-wrap:wrap}
.fil{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fc{padding:6px 12px;border-radius:20px;border:1.5px solid var(--linea);background:#fff;font-size:11.5px;font-weight:700;color:var(--mut)}
.fc.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.bar{height:6px;background:#EFEDE5;border-radius:3px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;border-radius:3px}
#map{height:430px;border-radius:12px;z-index:1}
.mk{width:22px;height:22px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;position:relative}
.mk.vip:after{content:'★';position:absolute;top:-9px;right:-7px;font-size:11px;color:var(--trigo);text-shadow:0 1px 2px #fff}
.mkc{width:30px;height:30px;border-radius:9px;background:var(--tinta);color:#fff;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.45)}
.rleg{display:flex;flex-wrap:wrap;gap:5px;font-size:10px;color:var(--mut)}
.rleg span{display:inline-flex;align-items:center;gap:4px;background:#FAF9F5;border:1px solid var(--linea);border-radius:6px;padding:2px 7px}
.ruta-i{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #EFEDE5}
.ruta-i:last-child{border-bottom:none}
.rn{width:22px;height:22px;border-radius:50%;background:var(--tinta);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.aviso{border-radius:9px;padding:9px 12px;font-size:11.5px;line-height:1.55;margin:8px 0}
.a-am{background:#FDF6E4;border:1px solid #EFDCA8;color:#8A6410}
.a-ro{background:var(--rojo-l);border:1px solid #EBC7C2;color:var(--rojo)}
.a-az{background:var(--azul-l);border:1px solid #C7D6E6;color:var(--azul)}
.a-ve{background:var(--verde-l);border:1px solid #C6DECF;color:var(--verde)}

/* modal ficha */
#mbg{position:fixed;inset:0;background:rgba(20,22,18,.42);z-index:900;display:none;align-items:center;justify-content:center;padding:20px}
#mbg.on{display:flex}
.modal{background:var(--carta);border-radius:14px;width:560px;max-width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mh{padding:16px 18px;border-bottom:1px solid var(--linea);display:flex;align-items:center;gap:10px}
.mh h3{font-size:15px;font-weight:800;flex:1}
.mx{width:34px;height:34px;border-radius:9px;background:var(--papel);font-size:15px}
.mb{padding:16px 18px}
#toast{position:fixed;left:18px;bottom:18px;z-index:1200;display:flex;flex-direction:column;gap:8px;max-width:340px}
.tst{background:var(--tinta);color:#F0EEE6;padding:11px 15px;border-radius:11px;font-size:12.5px;box-shadow:0 6px 20px rgba(0,0,0,.35);border-left:4px solid var(--trigo);animation:ti .25s}
@keyframes ti{from{opacity:0;transform:translateY(8px)}to{opacity:1}}

/* móvil */
.menu-btn{display:none}
@media(max-width:860px){
 .side{position:fixed;left:-230px;z-index:800;transition:left .25s}
 .side.on{left:0}
 .menu-btn{display:flex;width:38px;height:38px;border-radius:9px;background:var(--papel);border:1px solid var(--linea);align-items:center;justify-content:center;font-size:16px}
 .content{padding:14px 14px 60px}
 #map{height:340px}
}
</style>
</head>
<body>
<div class="shell">
 <aside class="side" id="side">
  <div class="logo"><b>Panel del administrador</b></div>
  <nav class="nav" id="nav"></nav>
  <div class="side-f"><span class="dot" style="background:#63A05E"></span> Servidor en línea · GPS hace 28 s<br>Última sincronización: hoy 09:41</div>
 </aside>
 <div class="main">
  <div class="top">
   <button class="menu-btn" onclick="document.getElementById('side').classList.toggle('on')">☰</button>
   <h1 id="top-t">Resumen</h1>
   <div style="flex:1"></div>
   <div class="st" id="bar-fecha"><span class="dot" style="background:#63A05E"></span> <span id="bar-txt">—</span></div>
<button class="st" id="bar-salir" onclick="admSalir()" style="cursor:pointer;border:1px solid var(--linea);background:var(--carta);color:inherit">Cerrar sesión</button>
  </div>
  <div class="content" id="content"></div>
 </div>
</div>
<div id="mbg" onclick="if(event.target===this)cerrarModal()"><div class="modal" id="modal"></div></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ═══════ DATOS FALSOS (coherentes con la operación real) ═══════ */
const LIMITE=230,UMBRAL=30,MARGEN=null,VIDA=null; // ⏳ margen y vida útil: pendientes
const money=v=>'S/ '+Number(v||0).toFixed(2);
const rep=d=>d<=1?{i:1,l:'Hoy',c:'var(--r1)',h:'#2F7D4F'}:d===2?{i:2,l:'Reciente',c:'var(--r2)',h:'#63A05E'}:d===3?{i:3,l:'Reponer no necesario',c:'var(--r3)',h:'#A9AE45'}:d===4?{i:4,l:'Reponer imprescindible',c:'var(--r4)',h:'#D9A32F'}:d===5?{i:5,l:'Posible desabastecimiento',c:'var(--r5)',h:'#DF7A2B'}:d<=10?{i:6,l:'Visitar necesariamente',c:'var(--r6)',h:'#C74E2C'}:d<30?{i:7,l:'Posible cliente perdido',c:'var(--r7)',h:'#8E3040'}:{i:8,l:'Cliente perdido',c:'var(--r8)',h:'#54222E'};

const TIENDAS=[];
const COND={};
let BANDEJA=[];
const KX=[];
const PERD=[];
const CIERRES=[];
const PEND=[];

/* ═══════ NAVEGACIÓN Y RENDERS ═══════ */
const SECS=[['resumen','◫','Resumen'],['bandeja','📥','Bandeja'],['mapa','🗺️','Mapa y rutas'],['tiendas','🏪','Tiendas'],['creditos','💳','Créditos'],['kardex','📒','Kardex'],['perdidas','📉','Pérdidas'],['cierres','💰','Cierres de viaje'],['conductores','🚛','Conductores'],['informe','📊','Informe diario'],['config','⚙️','Configuración']];
let CUR='resumen',FILTRO='todas',KSEL='general';
const $=id=>document.getElementById(id);
function toast(m){const t=document.createElement('div');t.className='tst';t.textContent=m;$('toast').appendChild(t);setTimeout(()=>t.remove(),3800);}
function nav(){$('nav').innerHTML=SECS.map(s=>`<button class="ni ${CUR===s[0]?'on':''}" onclick="ir('${s[0]}')"><span class="ic">${s[1]}</span>${s[2]}${s[0]==='bandeja'&&BANDEJA.length?`<span class="bd">${BANDEJA.length}</span>`:''}</button>`).join('');}
function ir(s){CUR=s;$('top-t').textContent=SECS.find(x=>x[0]===s)[2];$('side').classList.remove('on');nav();render();if(s==='mapa')setTimeout(initMap,80);}
function render(){$('content').innerHTML=({resumen:rResumen,bandeja:rBandeja,mapa:rMapa,tiendas:rTiendas,creditos:rCreditos,kardex:rKardex,perdidas:rPerdidas,cierres:rCierres,conductores:rConductores,informe:rInforme,config:rConfig})[CUR]();if(CUR==='mapa')setTimeout(initMap,80);}

function puntos(t){const d=t.d;if(d>10)return{sc:0,why:rep(d).l+' — alerta, no entra a ruta'};let b=d>=6?80:({1:5,2:12,3:22,4:45,5:65})[Math.min(d,5)]||0;const w=[rep(d).l+` (${d}d)`];if(t.vip&&d>=4){b=Math.round(b*1.5);w.push('★ VIP ×1.5 (desde 4d)');}else if(t.vip)w.push('VIP sin efecto (<4d)');if(t.pedidoHoy){b+=100;w.push('📩 pedido — garantizado hoy');}return{sc:b,why:w.join(' · ')};}
function rutaDe(cid){return COND[cid].tiendas.map(i=>TIENDAS.find(t=>t.id===i)).filter(t=>t&&t.act&&((t.d>=3&&t.d<=10)||t.pedidoHoy)).map(t=>({t,...puntos(t)})).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc);}

function rResumen(){return ''}

function bjHTML(b){return `<div class="bj ${b.c}"><div class="t">${b.t}</div><div class="d">${b.d}</div><div class="a">${b.a.map(a=>`<button class="btn ${a.cl||'b-l'}" onclick="acc(${b.id},'${a.fn}')">${a.l}</button>`).join('')}</div></div>`;}
function rBandeja(){return `<div class="aviso a-am" style="margin-top:0">Todo lo que requiere TU decisión llega aquí. Nada de esta lista se resuelve solo.</div>${BANDEJA.map(bjHTML).join('')||'<div class="card"><div class="cb" style="text-align:center;color:var(--mut)">Bandeja vacía.</div></div>'}`;}
function acc(id,fn){const b=BANDEJA.find(x=>x.id===id);BANDEJA=BANDEJA.filter(x=>x.id!==id);({waReg(){const t=TIENDAS.find(x=>x.id===1);t.pedidoHoy=true;toast('Pedido registrado a mano — entra a la ruta de HOY (+100, garantizado)');},okCorr(){toast('Corrección aprobada: stock devuelto, deuda −S/23.50, rastro guardado');},okRobo(){toast('Hecho');},noRobo(){toast('Hecho');},okVip(){const t=TIENDAS.find(x=>x.id===3);if(t)t.vip=true;toast('Tienda confirmada VIP');},okEnt(){toast('Recepción confirmada — el ciclo del dinero cerró');},difEnt(){toast('Diferencia registrada en el historial — mismo trato que el margen');},res(){toast('Resuelto y archivado');}})[fn]();nav();render();}

let MAP=null,LT=null,LR=null;
function rMapa(){
 const rj=rutaDe('juan'),rc=rutaDe('carlos');
 return `<div class="card"><div class="ch"><h3>🗺️ Espinar — tiendas por reposición y rutas de hoy</h3></div>
 <div class="cb" style="padding:10px"><div id="map"></div>
 <div class="rleg" style="margin-top:9px">${[1,2,3,4,5,6,7,8].map(i=>{const L=['1d','2d','3d','4d','5d','6-10d','>10d','30d+'][i-1];return `<span><span class="dot" style="background:var(--r${i})"></span>${L}</span>`;}).join('')}<span>★ VIP</span><span><span></div></div></div>
 <div class="g2">
  ${(USRS.filter(function(u){return u.activo}).map(function(u){return [u.nombre,[],u.usuario]})).map(([n,r])=>`<div class="card"><div class="ch"><h3>Ruta de ${n} — hoy</h3><span class="eyebrow">urgencia · VIP desde 4d · pedido garantizado <span class="pend">⏳ pesos: punto de partida</span></span></div><div class="cb">
  ${r.length?r.map((x,i)=>`<div class="ruta-i"><div class="rn">${i+1}</div><span class="dot" style="background:${rep(x.t.d).c}"></span><div style="flex:1"><b style="font-size:12.5px">${x.t.n} ${x.t.vip?'<span style="color:var(--trigo)">★</span>':''}</b><div style="font-size:10.5px;color:var(--mut)">${x.why}${x.t.sa>0?' · 💳 cobrar de paso '+money(x.t.sa):''}</div></div><span class="pill p-gr mono">${x.sc} pts</span></div>`).join(''):'<div style="color:var(--mut);font-size:12px">Sin paradas en rango hoy.</div>'}
  </div></div>`).join('')}
 </div>
 <div class="aviso a-az">La ruta se genera la noche anterior y se refresca sola al arrancar el día. El desempate fino por cercanía corre en el servidor.</div>`;
}
function initMap(){const dv=$('map');if(!dv||typeof L==='undefined')return;
 if(MAP){MAP.invalidateSize();pinta();return;}
 MAP=L.map('map').setView([-14.7935,-71.4110],14);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(MAP);
 LT=L.layerGroup().addTo(MAP);LR=L.layerGroup().addTo(MAP);pinta();}
function pinta(){LT.clearLayers();LR.clearLayers();
 TIENDAS.filter(t=>t.act).forEach(t=>{const r=rep(t.d);
  const ic=L.divIcon({className:'',html:`<div class="mk ${t.vip?'vip':''}" style="background:${r.h}">${t.d}</div>`,iconSize:[22,22],iconAnchor:[11,11]});
  L.marker([t.lat,t.lon],{icon:ic}).addTo(LT).bindPopup(`<b>${t.n}</b><br>${r.l} · ${t.d} días${t.vip?' · ★ VIP':''}${t.sa?'<br>Deuda: '+money(t.sa):''}`);});
 [['juan','#B97A1F'],['carlos','#33608F']].forEach(([k,col])=>{const r=rutaDe(k);if(r.length)L.polyline(r.map(x=>[x.t.lat,x.t.lon]),{color:col,weight:3.5,dashArray:'8 6',opacity:.85}).addTo(LR);});
}
function rTiendas(){
 const fs=[['todas','Todas'],['alerta','En alerta (≥5d)'],['limite','Al límite'],['vip','VIP ★'],['faltan','Datos incompletos'],['inactivas','Inactivas']];
 let L2=TIENDAS.filter(t=>FILTRO==='inactivas'?!t.act:t.act);
 if(FILTRO==='alerta')L2=L2.filter(t=>t.d>=5);if(FILTRO==='limite')L2=L2.filter(t=>t.sa>=LIMITE);
 if(FILTRO==='vip')L2=L2.filter(t=>t.vip);if(FILTRO==='faltan')L2=L2.filter(t=>t.falta.length);
 return `<div class="fil">${fs.map(f=>`<button class="fc ${FILTRO===f[0]?'on':''}" onclick="FILTRO='${f[0]}';render()">${f[1]}</button>`).join('')}</div>
 <div class="card"><div class="cb" style="overflow-x:auto"><table>
 <tr><th></th><th>Tienda</th><th>Reposición</th><th>Deuda / ${LIMITE}</th><th>Datos</th><th></th></tr>
 ${L2.map(t=>{const r=rep(t.d);const pct=Math.min(100,t.sa/LIMITE*100);return `<tr class="clk" onclick="ficha(${t.id})">
  <td><span class="dot" style="background:${r.c};width:11px;height:11px"></span></td>
  <td><b>${t.n}</b> ${t.vip?'<span style="color:var(--trigo)">★</span>':''}${t.act?'':' <span class="pill p-gr">inactiva</span>'}<div style="font-size:10.5px;color:var(--mut)">${t.z}</div></td>
  <td><div style="font-size:11px;font-weight:700;color:${r.c}">${r.l}</div><div style="font-size:10px;color:var(--mut)">${t.d} días</div></td>

    if(p.precios)PRECIOS[p.id]=p.precios;
    if(Array.isArray(p.no_tipos)&&p.no_tipos.length)NOTIPOS[p.id]=p.no_tipos;
    if(p.precio!=null)CATE[p.id]=Object.assign(CATE[p.id]||{},{precio:Number(p.precio)});
   });
  }
 }catch(e){}
})();
window.precioTipo=function(prodId,cat){
 var tipo=tipoPedido();
 var pr=(window.PRECIOS&&PRECIOS[prodId])||null;
 if(tipo&&pr&&pr[tipo]!=null)return Number(pr[tipo]);
 var e=(window.CATE&&CATE[prodId])||null;
 if(e&&e.precio!=null)return Number(e.precio);
 return Number((cat&&cat.precio)||0);
};
/* el selector respeta el tipo: oculta lo quitado y usa su precio */
if(typeof pkPinta==='function'){var _pp=pkPinta;window.pkPinta=function(p){
 var r=_pp.apply(this,arguments);
 if(p!=='pd')return r;
 try{

   ch.parentNode.insertBefore(d,ch);

  var dt=document.getElementById('pd-tipo');if(dt)dt.innerHTML=pdTipoChips();
 }catch(e){}
 try{

  var cat=CATA[(window._PK&&_PK.pd&&_PK.pd.cat)||0];

   (cat&&cat.prods||[]).forEach(function(pr){
    if((NOTIPOS[pr.id]||[]).indexOf(tipo)<0)return;
    var filas=cont.querySelectorAll('div');
    filas.forEach(function(f){
     if(f.textContent.indexOf(pr.n)===0&&f.querySelector('button'))f.style.display='none';
    });
   });
  }
  /* cabecera: decir con qué precios se está registrando */
  var cab=cont.firstElementChild;

 }catch(e){}

/* al elegir la tienda, repintar con sus precios */
setTimeout(function(){
 var s=document.getElementById('pd-tienda');
 if(s&&!s._tp){s._tp=true;s.addEventListener('change',function(){try{pkPinta('pd')}catch(e){}});}
},1200);
/* el total del pedido usa el precio del tipo */
if(typeof pkItems==='function'){var _pi=pkItems;window.pkItems=function(p){
 var arr=_pi.apply(this,arguments);
 if(p==='pd'&&Array.isArray(arr)){
  arr.forEach(function(x){
   try{var cat=(CATA||[]).find(function(c){return (c.prods||[]).some(function(y){return y.id===x.id})});

 }
 return arr;};}

<script id="v5preciosload">

<script id="v5sinfuga">
(function(){
/* ═══ Guardar un tipo ya no toca el precio general ═══
   Antes se escribía también `precio` (el general) y el otro tipo, al no tener
   precio propio, lo heredaba: por eso un cambio en bodega aparecía en mayorista. */
window.catGuardar=async function(){
 var c=CATA[CATCAT];if(!c)return;
 var general=(TIPOSEL==='general');
 var prods=c.prods.map(function(p){
  var precio=parseFloat((document.getElementById('px-'+p.id)||{}).value)||0;
  var costo=parseFloat((document.getElementById('pc-'+p.id)||{}).value)||0;
  var fila={id:p.id,cat:c.id,nombre:p.n,costo:costo};
  if(general){
   fila.precio=precio;                       /* precio base, sin tipo */
   fila.precios=PRECIOS[p.id]||{};           /* los de cada tipo, intactos */
  }else{
   PRECIOS[p.id]=PRECIOS[p.id]||{};
   PRECIOS[p.id][TIPOSEL]=precio;            /* solo el tipo elegido */
   fila.precios=PRECIOS[p.id];
   var g=(CATE[p.id]||{}).precio;
   fila.precio=(g!=null?Number(g):0);        /* el general se conserva tal cual */
  }
  return fila;
 });
 var r=await apiA('/admin/catalogo',{productos:prods});
 var m=document.getElementById('cat-msg');
 if(m)m.textContent=(r&&r.ok)
  ?('✓ Guardado '+(general?'como precio general':'solo para '+TIPOSEL)+' — los conductores lo reciben al sincronizar')
  :'No se pudo guardar';
 await cargarPreciosTipo();
 try{renderForzado()}catch(e){}
};
/* chip "General" junto a los tipos, para el precio base */

 var h='';try{h=_rc()}catch(e){return ''}
 var on=(TIPOSEL==='general');
 var chip='<button onclick="TIPOSEL=\'general\';renderForzado()" style="padding:6px 11px;border-radius:14px;font-size:11.5px;font-weight:800;cursor:pointer;'
  +'border:1.5px solid '+(on?'#B97A1F':'rgba(128,128,128,.35)')+';background:'+(on?'rgba(185,122,31,.12)':'none')+';color:'+(on?'#8A6410':'inherit')+'">💲 General</button>';
 /* se inserta antes del primer chip de tipo */
 h=h.replace(/(<button onclick="TIPOSEL=)/,chip+'$1');
 var nota=on
  ? '<div style="font-size:11px;color:#8A6410;margin:6px 0">Estás editando el <b>precio general</b>: lo usa cualquier tipo de tienda que no tenga precio propio.</div>'
  : '<div style="font-size:11px;opacity:.7;margin:6px 0">Estás editando solo los precios de <b>'+TIPOSEL+'</b>. Los demás tipos no cambian.</div>';
 h=h.replace(/(<div class="card">\s*<div class="ct">[^<]*[Pp]recios)/,nota+'$1');
 return h;};}
})();

<script id="v5sinprestamo">
(function(){
/* ═══ Una casilla vacía es "sin precio propio", no el precio de otro tipo ═══
   Antes se rellenaba con el precio del primer tipo que tuviera valor, y al
   guardar ese préstamo se volvía real: así se contagiaban los tipos. */
function propio(pid){var p=PRECIOS[pid]||{};return p[TIPOSEL]!=null}
function fallback(pid,cat){
 var pc=((PARAMS_A.precios_cat||{})[TIPOSEL]||{})[cat.id];
 if(pc!=null)return Number(pc);
 return Number(cat.precio||0);
}
if(typeof rCatalogo==='function'){var _rc=rCatalogo;window.rCatalogo=function(){
 var h='';try{h=_rc()}catch(e){return ''}
 if(TIPOSEL==='general')return h;
 var c=CATA[CATCAT];if(!c)return h;
 (c.prods||[]).forEach(function(p){
  if(propio(p.id))return;
  var re=new RegExp('(id="px-'+p.id+'"[^>]*?)value="[^"]*"');
  h=h.replace(re,'$1value="" placeholder="'+fallback(p.id,c).toFixed(2)+'"');
 });
 h=h.replace(/(<div class="card"><div class="ct">🏷️ Precios · [^<]*<\/div>)/,
  '$1<div style="font-size:11px;color:#8A6410;background:#FDF6E4;border:1px solid #EFDCA8;border-radius:9px;padding:8px 10px;margin-bottom:9px;line-height:1.5">'
  +'Las casillas <b>vacías</b> no tienen precio propio en <b>'+TIPOSEL+'</b>: se usará el precio de la categoría para este tipo (el número gris). '
  +'Escribe uno solo si quieres que ese producto cueste distinto aquí. Lo que escribas <b>no toca los demás tipos</b>.</div>');
 return h;};}

/* al guardar: vacío = quitar el precio propio de ese tipo */
window.catGuardar=async function(){
 var c=CATA[CATCAT];if(!c)return;
 var general=(TIPOSEL==='general');
 var prods=c.prods.map(function(p){
  var el=document.getElementById('px-'+p.id);
  var txt=el?String(el.value).trim():'';
  var costo=parseFloat((document.getElementById('pc-'+p.id)||{}).value)||0;
  var fila={id:p.id,cat:c.id,nombre:p.n,costo:costo};
  if(general){
   fila.precio=parseFloat(txt)||0;
   fila.precios=PRECIOS[p.id]||{};
  }else{
   PRECIOS[p.id]=PRECIOS[p.id]||{};
   if(txt===''){delete PRECIOS[p.id][TIPOSEL];}
   else{PRECIOS[p.id][TIPOSEL]=parseFloat(txt)||0;}
   fila.precios=PRECIOS[p.id];
   fila.reemplazar_precios=true;              /* que el servidor no reviva lo borrado */
   var g=(CATE[p.id]||{}).precio;
   fila.precio=(g!=null?Number(g):0);
  }
  return fila;
 });
 var r=await apiA('/admin/catalogo',{productos:prods});
 var m=document.getElementById('cat-msg');
 if(m)m.textContent=(r&&r.ok)
  ?('✓ Guardado '+(general?'como precio general':'solo para '+TIPOSEL)+' — los conductores lo reciben al sincronizar')
  :'No se pudo guardar';
 await cargarPreciosTipo();
 try{renderForzado()}catch(e){}
};
/* vaciar de una vez los precios de un tipo en esta categoría */
window.catVaciarTipo=async function(){
 if(TIPOSEL==='general')return alert('Elige un tipo de tienda.');
 var c=CATA[CATCAT];if(!c)return;
 if(!confirm('¿Quitar los precios propios de "'+TIPOSEL+'" en '+(c.nom||c.id)+'?\n\nEsos productos pasarán a usar el precio de la categoría para este tipo. Los demás tipos no se tocan.'))return;
 (c.prods||[]).forEach(function(p){var el=document.getElementById('px-'+p.id);if(el)el.value='';});
 await catGuardar();
};
})();
</script>

<script id="v5dupids">
(function(){
/* ═══ Hay casillas repetidas con el mismo id (dos tarjetas de catálogo).
   getElementById devolvía siempre la primera, casi siempre vacía: por eso
   "Añadir categoría" no hacía nada. Se lee la que el usuario está usando. ═══ */
window.campo=function(id){
 var els=document.querySelectorAll('[id="'+id+'"]');
 if(!els.length)return null;
 for(var i=0;i<els.length;i++){var e=els[i];
  if(e.offsetParent!==null&&String(e.value||'').trim()!=='')return e;}
 for(var j=0;j<els.length;j++){if(els[j].offsetParent!==null)return els[j];}
 return els[0];
};
window.valorCampo=function(id){var e=campo(id);return e?String(e.value||'').trim():''};
window.limpiaCampo=function(id){var els=document.querySelectorAll('[id="'+id+'"]');for(var i=0;i<els.length;i++)els[i].value='';};

window.catAgregar=async function(){
 var n=valorCampo('nc-nom');
 if(!n)return alert('Escribe el nombre de la categoría en la casilla y vuelve a pulsar Añadir.');
 var base=slug(n).slice(0,20),id=base,k=2;
 while(CATA.find(function(x){return x.id===id})){id=base.slice(0,18)+'_'+k;k++;if(k>50)break;}
 if(CATA.find(function(x){return (x.nom||'').toLowerCase()===n.toLowerCase()}))
  return alert('Ya existe una categoría con ese nombre.');
 CATA.push({id:id,nom:n,emoji:valorCampo('nc-emo')||'📦',precio:parseFloat(valorCampo('nc-pre'))||0,prods:[]});
 var r=await catsGuardar();
 CATCAT=CATA.length-1;
 limpiaCampo('nc-nom');limpiaCampo('nc-emo');limpiaCampo('nc-pre');
 await sincronizarCatalogo();
 alert('✓ Categoría "'+n+'" creada. Ya aparece en Catálogo, en Pedidos WhatsApp y en la app del conductor tras sincronizar.');
};
window.prodAgregar=async function(){
 var n=valorCampo('np-nom');
 if(!n)return alert('Escribe el nombre del producto en la casilla y vuelve a pulsar Añadir.');
 var c=CATA[CATCAT];if(!c)return alert('Elige primero una categoría.');
 if((c.prods||[]).some(function(p){return (p.n||'').toLowerCase()===n.toLowerCase()}))
  return alert('Ya hay un producto con ese nombre en esta categoría.');
 var pv=parseFloat(valorCampo('np-pv'));
 var cuerpo={id:c.id+'_'+slug(n),cat:c.id,nombre:n,costo:0,precio:0,precios:{}};
 if(!isNaN(pv)&&pv>0){
  if(TIPOSEL==='general'){
   if(!confirm('Vas a crear "'+n+'" con precio general S/'+pv.toFixed(2)+'.\n\nLo usarán TODOS los tipos que no tengan precio propio. ¿Continuar?'))return;
   cuerpo.precio=pv;
  }else cuerpo.precios[TIPOSEL]=pv;
 }
 var r=await apiA('/admin/catalogo/producto',cuerpo);
 if(!(r&&r.ok))return alert('No se pudo crear: '+((r&&r.error)||'sin respuesta del servidor'));
 var id=r.id||cuerpo.id;
 c.prods.push({id:id,n:n});CATE[id]={precio:cuerpo.precio,costo:0};PRECIOS[id]=Object.assign({},cuerpo.precios);
 limpiaCampo('np-nom');limpiaCampo('np-pv');
 await sincronizarCatalogo();
 alert('✓ "'+n+'" creado'+((!isNaN(pv)&&pv>0&&TIPOSEL!=='general')?(' con precio S/'+pv.toFixed(2)+' solo para '+TIPOSEL):'')+'. Ya está en Pedidos WhatsApp.');
};

/* ═══ Un solo lugar que refresca catálogo, pedidos y selectores ═══ */
window.sincronizarCatalogo=async function(){
 try{
  if(typeof catCargar==='function')await catCargar();
  if(typeof cargarPreciosTipo==='function')await cargarPreciosTipo();
  if(typeof pkReset==='function'){/* el selector de pedidos vuelve a leer el catálogo */}
  if(typeof pkPinta==='function'&&document.getElementById('pd-prods'))pkPinta('pd');
  if(typeof renderForzado==='function')renderForzado();
 }catch(e){console.error('sincronizar:',e)}
};
/* borrar producto o tipo también refresca pedidos */
['prodBorrar','prodQuitarTipo','prodDevolverTipo','tipoNuevo','tipoQuitar','catsGuardar'].forEach(function(fn){
 if(typeof window[fn]==='function'){var _o=window[fn];window[fn]=async function(){
  var r=await _o.apply(this,arguments);
  try{if(typeof pkPinta==='function'&&document.getElementById('pd-prods'))pkPinta('pd')}catch(e){}
  return r;};}
});
})();
</script>
